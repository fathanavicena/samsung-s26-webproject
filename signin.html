<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — jual hp samsung</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* [Gunakan salinan CSS :root hingga .btn-solid-gold dari File Contact Us di atas] */
        :root {
            --bg-color: #050505;
            --text-color: #ffffff;
            --accent-gold: #d4af37;
            --glass-bg: rgba(25, 25, 25, 0.55);
            --glass-border: rgba(212, 175, 55, 0.15);
            --font-main: 'Outfit', sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-main); }
        body { background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
        body::before { content: ''; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 60vw; height: 60vw; background: radial-gradient(circle, rgba(212, 175, 55, 0.03) 0%, rgba(0,0,0,0) 60%); z-index: -1; pointer-events: none; }
        header { width: 100%; background: rgba(5, 5, 5, 0.85); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(212, 175, 55, 0.15); position: sticky; top: 0; z-index: 1000; }
        .navbar { max-width: 1200px; margin: 0 auto; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 22px; font-weight: 700; letter-spacing: 1px; color: #ffffff; text-decoration: none; text-transform: uppercase; }
        .logo span { color: var(--accent-gold); }
        .nav-links { display: flex; list-style: none; gap: 30px; }
        .nav-links a { color: #ffffff; text-decoration: none; font-size: 15px; }
        .nav-links a:hover { color: var(--accent-gold); }
        .glass-card { background: var(--glass-bg); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 1px solid var(--glass-border); border-radius: 14px; padding: 45px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6); }
        .form-group { margin-bottom: 22px; display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; color: rgba(255, 255, 255, 0.6); }
        .form-input { width: 100%; background: rgba(10, 10, 10, 0.6); border: 1px solid rgba(255, 255, 255, 0.15); padding: 14px 16px; border-radius: 6px; color: #ffffff; font-size: 15px; outline: none; transition: all 0.3s ease; }
        .form-input:focus { border-color: var(--accent-gold); box-shadow: 0 0 10px rgba(212, 175, 55, 0.25); background: rgba(20, 20, 20, 0.8); }
        .btn-solid-gold { width: 100%; background-color: var(--accent-gold); color: #050505; border: 1px solid var(--accent-gold); padding: 15px; font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; border-radius: 6px; cursor: pointer; transition: all 0.3s ease; }
        .btn-solid-gold:hover { background-color: transparent; color: var(--accent-gold); box-shadow: 0 5px 20px rgba(212, 175, 55, 0.3); }
        footer { background: #020202; border-top: 1px solid rgba(212, 175, 55, 0.1); padding: 35px 20px; margin-top: auto; }
        .footer-content { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .footer-text { color: rgba(255, 255, 255, 0.4); font-size: 14px; }

        /* Form Center Wrapper */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .center-form-box {
            max-width: 440px;
            width: 100%;
        }

        .form-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-header h1 {
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .form-header p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            font-weight: 300;
        }

        .forgot-container {
            text-align: right;
            margin-top: -10px;
            margin-bottom: 25px;
        }

        .forgot-link {
            color: var(--accent-gold);
            text-decoration: none;
            font-size: 13px;
            transition: color 0.3s ease;
        }

        .forgot-link:hover {
            color: #ffffff;
        }

        .switch-form-text {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
        }

        .switch-form-text a {
            color: var(--accent-gold);
            text-decoration: none;
            font-weight: 500;
        }

        .switch-form-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <header>
        <div class="navbar">
            <a href="index.html" class="logo">jual <span>hp samsung</span></a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="aboutus.html">About Us</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
            <div class="nav-actions"></div>
        </div>
    </header>

    <main>
        <div class="center-form-box">
            <div class="glass-card">
                <div class="form-header">
                    <h1>Selamat Datang</h1>
                    <p>Silakan masuk menggunakan akun Anda</p>
                </div>
                <form onsubmit="event.preventDefault();">
                    <div class="form-group">
                        <label for="email">Alamat Email</label>
                        <input type="email" id="email" class="form-input" placeholder="nama@email.com" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Kata Sandi</label>
                        <input type="password" id="password" class="form-input" placeholder="••••••••••••" required>
                    </div>
                    <div class="forgot-container">
                        <a href="#" class="forgot-link">Forgot Password?</a>
                    </div>
                    <button type="submit" class="btn-solid-gold">Login</button>
                </form>
                <div class="switch-form-text">
                    Belum memiliki akun? <a href="signup.html">Daftar Sekarang</a>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <a href="#" class="logo" style="font-size: 16px;">jual <span>hp samsung</span></a>
            <div class="footer-text">&copy; 2026 jual hp samsung Premium Coffee. All Rights Reserved.</div>
        </div>
    </footer>

</body>
</html>
